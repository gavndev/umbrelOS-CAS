version: "3.8"
services:
  app_proxy:
    environment:
      APP_HOST: beets-umbrelOS_web_1
      APP_PORT: 8337

  web:
    image: lscr.io/linuxserver/beets:latest
    restart: on-failure
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=America/Chicago
    volumes:
      - ${APP_DATA_DIR}/data/config:/config
      - ${APP_DATA_DIR}/data/music:/music
      - ${APP_DATA_DIR}/data/downloads:/downloads
